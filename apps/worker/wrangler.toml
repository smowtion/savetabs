name = "savetabs"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[routes]]
pattern = "savetabs-api.azcom.dev"
custom_domain = true

# Sync metadata (keys, encrypted sessions, tombstones, daily counters).
# Replace `database_id` with the id printed by `wrangler d1 create savetabs`
# before the first remote deploy; local dev and tests use the local database.
[[d1_databases]]
binding = "DB"
database_name = "savetabs"
database_id = "801f65e9-52c1-4702-b511-842281a033dc"
migrations_dir = "migrations"

# Release artifacts and versions.json served by GET /v1/version.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "savetabs-releases"

# Abuse controls (spec §6.3): one binding per threshold because Cloudflare
# configures a single limit per namespace. Each is optional in Env, so a
# deployment without them simply skips that bucket.
[[ratelimits]]
name = "RATE_LIMITER_IP"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_AUTH"
namespace_id = "1002"
simple = { limit = 240, period = 60 }

# Account signup and reset requests, keyed by normalized email address.
[[ratelimits]]
name = "RATE_LIMITER_EMAIL"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# Daily retention sweep for accounts that never verified their address and
# never linked a vault (30-day TTL). Runs at 03:17 UTC.
[triggers]
crons = ["17 3 * * *"]

[vars]
# Only this origin (the web app) may call the API from a browser; the
# extension sends a bearer token and no cookies.
WEB_ORIGIN = "https://savetabs.azcom.dev"
GLOBAL_DAILY_REQUESTS = "100000"
GLOBAL_MAX_KEYS = "10000"
# Sender for account verification and reset emails. RESEND_API_KEY is a secret
# set with `wrangler secret put`.
RESEND_FROM = "SaveTabs <noreply@azcom.dev>"
